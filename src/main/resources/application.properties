spring.application.name=hobby-hub

spring.datasource.url=jdbc:postgresql://localhost:5432/hobbyhub_db
spring.datasource.username=hobbyhub_user
spring.datasource.password=hobbyhub_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dados iniciais: roda os scripts de db/inicial toda vez que a API sobe, depois que o Hibernate cria as tabelas.
# Os scripts só inserem o que ainda não existe, então não apagam nem duplicam dados.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/inicial/01-planos.sql,classpath:db/inicial/02-usuarios-teste.sql,classpath:db/inicial/03-aulas-exemplo.sql,classpath:db/inicial/04-horarios-recorrentes.sql

